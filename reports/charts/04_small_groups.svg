  <g id="text_1">
   <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17233f" x="34.56" y="29.16" transform="rotate(-0 34.56 29.16)">5,77% — это всего три повторных покупателя</text>
  </g>
  <g id="text_2">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637087" x="34.56" y="52.488" transform="rotate(-0 34.56 52.488)">Сумки и аксессуары · первая доставка с опозданием · январь 2017 — январь 2018.</text>
  </g>
  <g id="text_3">
   <text style="font-weight: 700; font-size: 42px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17233f" x="47.52" y="167.184" transform="rotate(-0 47.52 167.184)">3 из 52</text>
  </g>
  <g id="text_4">
   <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637087" x="47.52" y="198.288" transform="rotate(-0 47.52 198.288)">купили снова за 180 дней</text>
  </g>
  <g id="text_5">
   <text style="font-weight: 700; font-size: 22px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17233f" x="47.52" y="233.28" transform="rotate(-0 47.52 233.28)">2 из этих 3</text>
  </g>
  <g id="text_6">
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #637087" transform="translate(47.52 261.838125)">оформили повтор ещё до</text>
   <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #637087" transform="translate(47.52 275.2755)">получения первой покупки</text>
  </g>
  <g id="text_7">
   <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637087" x="397.44" y="295.488" transform="rotate(-0 397.44 295.488)">Одна точка = один покупатель. Оранжевые купили повторно.</text>
  </g>
  <g id="text_8">
   <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #17233f" x="47.52" y="342.144" transform="rotate(-0 47.52 342.144)">Ещё один повторный покупатель — и доля была бы уже 7,69% (+1,92 п.п.).</text>
  </g>
  <g id="text_9">
   <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #637087" x="47.52" y="367.416" transform="rotate(-0 47.52 367.416)">Сравнивать 5,77% с 4,71% у доставки вовремя как устойчивое преимущество здесь нельзя.</text>
  </g>
